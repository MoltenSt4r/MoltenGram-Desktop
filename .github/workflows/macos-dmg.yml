name: macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Package DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "MoltenGram-Desktop-macos-$ARCH.$VERSION.zip"
          mkdir -p "dmg_$ARCH"
          ditto -x -k "MoltenGram-Desktop-macos-$ARCH.$VERSION.zip" "dmg_$ARCH"
          ln -s /Applications "dmg_$ARCH/Applications"
          hdiutil create -volname "MoltenGram Desktop" -srcfolder "dmg_$ARCH" -ov -format UDZO \
            "MoltenGram-Desktop-macos-$ARCH.$VERSION.dmg"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "MoltenGram-Desktop-macos-$ARCH.$VERSION.dmg" --clobber
