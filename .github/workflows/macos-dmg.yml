name: macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Package DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "MoltenGram-Desktop-macos-$ARCH.$VERSION.zip"
          mkdir -p "dmg_$ARCH"
          ditto -x -k "MoltenGram-Desktop-macos-$ARCH.$VERSION.zip" "dmg_$ARCH"
          ln -s /Applications "dmg_$ARCH/Applications"
          DMG_OUT="MoltenGram-Desktop-macos-$ARCH.$VERSION.dmg"
          for attempt in 1 2 3 4 5; do
            hdiutil detach "/Volumes/MoltenGram Desktop" -force >/dev/null 2>&1 || true
            rm -f "$DMG_OUT"
            if hdiutil create -volname "MoltenGram Desktop" -srcfolder "dmg_$ARCH" -ov -format UDZO "$DMG_OUT"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "hdiutil create failed after 5 attempts"
              exit 1
            fi
            sleep 5
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "$DMG_OUT" --clobber
