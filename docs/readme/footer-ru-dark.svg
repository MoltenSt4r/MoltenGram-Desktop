<text x="98" y="41" fill="#FFDAD3" font-size="12" font-weight="700" text-anchor="middle">GPL-3.0 FOSS</text>
<text x="168" y="42" fill="#F6E0DC" font-size="16" font-weight="700">MoltenGram Desktop · Свободное ПО (GNU GPL v3.0)</text>
<text x="28" y="78" fill="#D8C1BC" font-size="13" font-weight="500">На базе Telegram Desktop и exDesktop · Вдохновлено exteraGram и AyuGram Desktop</text>
</svg>